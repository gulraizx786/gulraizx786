<svg width="420" height="200" viewBox="0 0 420 200" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="lbg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#0f0524"/>
    <stop offset="100%" stop-color="#2a0e4a"/>
  </linearGradient>
</defs>
<style>
<![CDATA[
  text { font-family: 'Segoe UI', Verdana, Arial, sans-serif; }
  .fadeIn { opacity:0; animation: fadeInKf 0.6s ease forwards; }
  @keyframes fadeInKf { to { opacity:1; } }
  .bar { animation: barKf 1.2s ease forwards; }
  @keyframes barKf { from { width:0; } }
]]>
</style>
<rect x="0" y="0" width="420" height="200" rx="14" fill="url(#lbg)" stroke="#4a1259"/>
<text class="fadeIn" x="20" y="32" font-size="16" font-weight="700" fill="#f1e9ff" style="animation-delay:0.1s">Most Used Languages</text>

<g transform="translate(20,54)">
  <text font-size="12" fill="#f1e9ff">JavaScript</text>
  <rect x="0" y="8" width="380" height="9" rx="4" fill="#1a0a35"/>
  <rect class="bar" x="0" y="8" width="160" height="9" rx="4" fill="#f1e05a" style="animation-delay:0.3s"/>

  <text font-size="12" fill="#f1e9ff" y="36">HTML</text>
  <rect x="0" y="44" width="380" height="9" rx="4" fill="#1a0a35"/>
  <rect class="bar" x="0" y="44" width="120" height="9" rx="4" fill="#e34c26" style="animation-delay:0.45s"/>

  <text font-size="12" fill="#f1e9ff" y="72">CSS</text>
  <rect x="0" y="80" width="380" height="9" rx="4" fill="#1a0a35"/>
  <rect class="bar" x="0" y="80" width="95" height="9" rx="4" fill="#563d7c" style="animation-delay:0.6s"/>

  <text font-size="12" fill="#f1e9ff" y="108">Python</text>
  <rect x="0" y="116" width="380" height="9" rx="4" fill="#1a0a35"/>
