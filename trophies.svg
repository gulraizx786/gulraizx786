<svg width="820" height="170" viewBox="0 0 820 170" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="tbg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#0f0524"/>
    <stop offset="100%" stop-color="#2a0e4a"/>
  </linearGradient>
  <linearGradient id="shine2" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="50%" stop-color="#ffffff" stop-opacity="0.25"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
</defs>
<style>
<![CDATA[
  text { font-family: 'Segoe UI', Verdana, Arial, sans-serif; }
  .cell { opacity:0; animation: popKf 0.5s ease forwards; }
  @keyframes popKf { from { opacity:0; } to { opacity:1; } }
  .shineSweep { animation: sweepKf 3s linear infinite; }
  @keyframes sweepKf { 0% { transform: translateX(-140px); } 100% { transform: translateX(140px); } }
]]>
</style>
<rect x="0" y="0" width="820" height="170" rx="14" fill="url(#tbg)" stroke="#4a1259"/>

<g class="cell" transform="translate(20,20)" style="animation-delay:0.1s">
  <rect width="180" height="130" rx="12" fill="#1a0a35" stroke="#ff4fd8"/>
  <text x="90" y="46" font-size="30" text-anchor="middle">&#127942;</text>
  <text x="90" y="80" font-size="12" fill="#f1e9ff" text-anchor="middle">Pull Shark</text>
  <text x="90" y="100" font-size="10" fill="#c9b8ea" text-anchor="middle">rank: coming soon</text>
  <g clip-path="none"><rect class="shineSweep" x="-30" y="0" width="60" height="130" fill="url(#shine2)"/></g>
</g>
<g class="cell" transform="translate(220,20)" style="animation-delay:0.25s">
  <rect width="180" height="130" rx="12" fill="#1a0a35" stroke="#a855f7"/>
  <text x="90" y="46" font-size="30" text-anchor="middle">&#11088;</text>
  <text x="90" y="80" font-size="12" fill="#f1e9ff" text-anchor="middle">Starstruck</text>
  <text x="90" y="100" font-size="10" fill="#c9b8ea" text-anchor="middle">rank: coming soon</text>
  <rect class="shineSweep" x="-30" y="0" width="60" height="130" fill="url(#shine2)" style="animation-delay:0.4s"/>
</g>
<g class="cell" transform="translate(420,20)" style="animation-delay:0.4s">
  <rect width="180" height="130" rx="12" fill="#1a0a35" stroke="#7c3aed"/>
  <text x="90" y="46" font-size="30" text-anchor="middle">&#128293;</text>
  <text x="90" y="80" font-size="12" fill="#f1e9ff" text-anchor="middle">Quickdraw</text>
  <text x="90" y="100" font-size="10" fill="#c9b8ea" text-anchor="middle">rank: coming soon</text>
  <rect class="shineSweep" x="-30" y="0" width="60" height="130" fill="url(#shine2)" style="animation-delay:0.8s"/>
</g>
<g class="cell" transform="translate(620,20)" style="animation-delay:0.55s">
  <rect width="180" height="130" rx="12" fill="#1a0a35" stroke="#ff8de3"/>
  <text x="90" y="46" font-size="30" text-anchor="middle">&#128640;</text>
  <text x="90" y="80" font-size="12" fill="#f1e9ff" text-anchor="middle">YOLO</text>
  <text x="90" y="100" font-size="10" fill="#c9b8ea" text-anchor="middle">rank: coming soon</text>
  <rect class="shineSweep" x="-30" y="0" width="60" height="130" fill="url(#shine2)" style="animation-delay:1.2s"/>
</g>
</svg>
