<svg width="420" height="200" viewBox="0 0 420 200" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="sbg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#0f0524"/>
    <stop offset="100%" stop-color="#2a0e4a"/>
  </linearGradient>
</defs>
<style>
<![CDATA[
  text { font-family: 'Segoe UI', Verdana, Arial, sans-serif; }
  .fadeIn { opacity:0; animation: fadeInKf 0.6s ease forwards; }
  @keyframes fadeInKf { to { opacity:1; } }
  .slideRow { opacity:0; animation: slideKf 0.6s ease forwards; }
  @keyframes slideKf { to { opacity:1; } }
  .ring { transform-origin: 60px 100px; animation: ringSpin 1.6s ease forwards; }
  @keyframes ringSpin { from { stroke-dashoffset: 220; } }
]]>
</style>
<rect x="0" y="0" width="420" height="200" rx="14" fill="url(#sbg)" stroke="#4a1259"/>
<text class="fadeIn" x="20" y="32" font-size="16" font-weight="700" fill="#f1e9ff" style="animation-delay:0.1s">Gulraiz's GitHub Stats</text>

<circle cx="60" cy="100" r="38" fill="none" stroke="#1a0a35" stroke-width="8"/>
<circle class="ring" cx="60" cy="100" r="38" fill="none" stroke="#ff4fd8" stroke-width="8" stroke-linecap="round" stroke-dasharray="220" transform="rotate(-90 60 100)"/>
<text x="60" y="96" font-size="18" font-weight="700" fill="#f1e9ff" text-anchor="middle">New</text>
<text x="60" y="114" font-size="11" fill="#c9b8ea" text-anchor="middle">Contributor</text>

<g transform="translate(130,58)">
  <text class="slideRow" y="0" font-size="13" fill="#f1e9ff" style="animation-delay:0.3s">&#9733; Total Stars Earned: <tspan fill="#ff8de3" font-weight="700">--</tspan></text>
  <text class="slideRow" y="28" font-size="13" fill="#f1e9ff" style="animation-delay:0.45s">&#128295; Total Commits: <tspan fill="#a855f7" font-weight="700">--</tspan></text>
  <text class="slideRow" y="56" font-size="13" fill="#f1e9ff" style="animation-delay:0.6s">&#128228; Total PRs: <tspan fill="#7c3aed" font-weight="700">--</tspan></text>
  <text class="slideRow" y="84" font-size="13" fill="#f1e9ff" style="animation-delay:0.75s">&#9989; Issues Closed: <tspan fill="#ff4fd8" font-weight="700">--</tspan></text>
  <text class="slideRow" y="112" font-size="11" fill="#7c6a9c" style="animation-delay:0.9s">update these numbers as your GitHub activity grows</text>
</g>
</svg>
